version: 2.1

workflows:
    sylius2.x-tests:
        jobs:
            # Sylius 2.1 - Symfony 7.4
            -   build:
                    name: php-8.3-sylius-2.1-symfony-7.4
                    matrix:
                        parameters:
                            sylius_version: [ "2.1" ]
                            php_version: [ "8.3" ]
                            symfony_version: [ "7.4" ]

            # Sylius 2.2 - Symfony 7.4
            -   build:
                    name: php-8.3-sylius-2.2-symfony-7.4
                    matrix:
                        parameters:
                            sylius_version: [ "2.2" ]
                            php_version: [ "8.3" ]
                            symfony_version: [ "7.4" ]

            # Sylius 2.3 - Symfony 7.4
            -   build:
                    name: php-8.3-sylius-2.3-symfony-7.4
                    matrix:
                        parameters:
                            sylius_version: [ "2.3" ]
                            php_version: [ "8.3" ]
                            symfony_version: [ "7.4" ]

            # Sylius 2.3 - Symfony 8.1
            -   build:
                    name: php-8.4-sylius-2.3-symfony-8.1
                    matrix:
                        parameters:
                            sylius_version: [ "2.3" ]
                            php_version: [ "8.4" ]
                            symfony_version: [ "8.1" ]

jobs:
    build:
        parameters:
            sylius_version:
                type: string
            symfony_version:
                type: string
            php_version:
                type: string
        docker:
            -   image: webdevops/php-nginx:<< parameters.php_version >>
                environment:
                    - SYMFONY_REQUIRE=<< parameters.symfony_version >>.*
                    - DATABASE_URL=mysql://root:pass_root@127.0.0.1:3306/3brs_sylius_contact_form_plugin_%kernel.environment%?serverVersion=8.0
            -   image: cimg/mysql:8.0
                environment:
                    MYSQL_ROOT_PASSWORD: pass_root
                    MYSQL_USER: sylius
                    MYSQL_PASSWORD: pass

        steps:
            - checkout
            # to avoid installing different package "Note, selecting 'cmdtest' instead of 'yarn'"
            -   run: curl -sS https://dl.yarnpkg.com/debian/pubkey.gpg | apt-key add -
            -   run: echo "deb https://dl.yarnpkg.com/debian/ stable main" | tee /etc/apt/sources.list.d/yarn.list
            -   run: curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
            -   run: apt-get update
                # netcat to get 'nc' command for waiting for database
            -   run: apt-get install -y nodejs yarn mariadb-client netcat-openbsd
            -   run: composer self-update

            # Sylius & Symfony in current matrix versions
            -   run: composer require "sylius/sylius:<< parameters.sylius_version >>.*" --no-interaction --no-update --no-scripts
            # global Flex applies SYMFONY_REQUIRE to all symfony/* packages including transitive ones
            -   run: composer global config --no-plugins allow-plugins.symfony/flex true
            -   run: composer global require --no-progress --no-scripts --no-plugins symfony/flex
            # Sylius 2.1 and 2.2 Behat contexts need Behat 3, their admin and shop assets Encore 5
            -   when:
                    condition:
                        matches:
                            pattern: "^2\\.[12]$"
                            value: << parameters.sylius_version >>
                    steps:
                        -   run: composer require --dev "behat/behat:^3.34" --no-interaction --no-update --no-scripts
                        -   run: cd tests/Application && npm pkg set "devDependencies.@symfony/webpack-encore=^5.0.1"

            -   run:
                    name: Wait for database
                    command: timeout 60s bash -c -- 'while ! nc -z 127.0.0.1 3306; do sleep 0.1; done' \
                        && timeout 30s bash -c -- 'mysql --user=sylius --password=pass --host=127.0.0.1 --port=3306 -e "exit"'

            # COMPOSER PREFER LOWEST (oldest possible) #
            -   run: rm -fr composer.lock
            -   run: COMPOSER_MEMORY_LIMIT=-1 composer update --no-interaction --prefer-lowest
            -   run: yarn --cwd tests/Application install
            -   run: yarn --cwd tests/Application build
            -   run: APP_ENV=dev bin/phpstan.sh
            -   run: APP_ENV=dev bin/ecs.sh --clear-cache
            -   run: APP_ENV=dev bin/symfony-lint.sh
            -   run: APP_ENV=dev bin/phpunit
            -   run: (cd tests/Application && bin/console doctrine:database:drop --if-exists --env=test -vvv --force)
            -   run: bin/behat.sh

            # COMPOSER PREFER DIST #
            -   run: rm -fr vendor
            -   run: COMPOSER_MEMORY_LIMIT=-1 composer update --no-interaction --prefer-dist
            -   run: yarn --cwd tests/Application install
            -   run: yarn --cwd tests/Application build
            -   run: APP_ENV=dev bin/phpstan.sh
            -   run: APP_ENV=dev bin/ecs.sh --clear-cache
            -   run: APP_ENV=dev bin/symfony-lint.sh
            -   run: APP_ENV=dev bin/phpunit
            -   run: (cd tests/Application && bin/console doctrine:database:drop --if-exists --env=test -vvv --force)
            -   run: bin/behat.sh
